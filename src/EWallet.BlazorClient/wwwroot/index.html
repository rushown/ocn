<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EWallet — Secure Digital Payments" />
    <meta name="theme-color" content="#2563EB" />
    <title>EWallet</title>
    <base href="/" />

    <!-- MudBlazor -->
    <link href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- App styles -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <!-- Loading spinner shown while WASM initializes -->
        <div id="wasm-loading"
             style="
               display: flex;
               flex-direction: column;
               align-items: center;
               justify-content: center;
               height: 100vh;
               background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 50%, #7C3AED 100%);
               font-family: Inter, sans-serif;
               color: white;
             ">
            <!-- Logo -->
            <div style="font-size: 4rem; margin-bottom: 16px;">💳</div>
            <div style="font-size: 1.5rem; font-weight: 700; margin-bottom: 8px;">EWallet</div>
            <div style="font-size: 0.875rem; opacity: 0.8; margin-bottom: 32px;">Secure Digital Payments</div>

            <!-- Spinner -->
            <div style="
                width: 40px;
                height: 40px;
                border: 3px solid rgba(255,255,255,0.3);
                border-top-color: white;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            "></div>

            <div style="margin-top: 16px; font-size: 0.75rem; opacity: 0.6;">Loading application…</div>
        </div>

        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            #wasm-loading { transition: opacity 0.3s ease; }
        </style>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- MudBlazor JS -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <!-- Blazored.LocalStorage -->
    <script src="_content/Blazored.LocalStorage/blazored-localstorage.js"></script>

    <!-- Fluxor -->
    <script src="_content/Fluxor.Blazor.Web/scripts/index.js"></script>

    <!-- App JS -->
    <script src="js/app.js"></script>

    <!-- Blazor WASM loader (hides spinner on load) -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start().then(() => {
            const loading = document.getElementById('wasm-loading');
            if (loading) {
                loading.style.opacity = '0';
                setTimeout(() => loading.remove(), 300);
            }
        });
    </script>
</body>

</html>
