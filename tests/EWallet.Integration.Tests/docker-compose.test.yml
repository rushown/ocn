version: '3.9'

# Lightweight infrastructure for local integration test runs.
# Testcontainers already manages its own containers in CI,
# so this file is primarily for running tests locally without Docker Desktop.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   dotnet test EWallet.Integration.Tests
#   docker compose -f docker-compose.test.yml down

services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     test
      POSTGRES_PASSWORD: test
      POSTGRES_DB:       ewallet_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d ewallet_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
